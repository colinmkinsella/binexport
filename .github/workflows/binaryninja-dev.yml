name: binaryninja-dev
run-name: binaryninja-dev

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily

jobs:
  get-dev-tag-list:
    runs-on: ubuntu-latest
    steps:
    - name: Get Dev Tags
      id: get-dev-tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tags=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/Vector35/binaryninja-api/git/refs/tags)
        while read -r tag_hash tag_type ref_name; do
          if [[ "$tag_type" == "commit" ]]; then
            tag_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/Vector35/binaryninja-api/git/commits/$tag_hash)
            tag_date=$(echo $tag_json | jq -r .committer.date)
            tag_name=$(echo $ref_name)
            echo "tag_name=$tag_name tag_date=$tag_date"
          fi
        done < <(echo $tags | jq -r '.[].object | "\(.sha) \(.type) \(.ref)"')

