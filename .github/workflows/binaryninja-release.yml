name: binaryninja-release

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag for the release"
        required: true
        type: string
      release_title:
        description: "Release title."
        required: true
        type: string
      release_notes:
        description: "Release notes as a string."
        required: true
        type: string
      version:
        description: "Binary Ninja API Tag or Commit"
        required: true
        type: string

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check if ${{ inputs.release_tag }} release exists
      id: check-if-release-exists
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view ${{ inputs.release_tag }}; then
          echo "release found"
          echo "release_exists=true" >> $GITHUB_ENV
        else
          echo "release not found"
          echo "release_exists=false" >> $GITHUB_ENV
        fi

    - name: Delete ${{ inputs.release_tag }} release
      if: steps.check-if-release-exists.outputs.release_exists == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete ${{ inputs.release_tag }} --cleanup-tag --yes
        echo "waiting for tag to be deleted"
        while git fetch --tags --prune-tags; git tag -l | grep ${{ inputs.release_tag }}; do
          sleep 5;
        done

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create ${{ inputs.release_tag }}
        --title "${{ inputs.release_title }}"
        --notes ${{ inputs.release_notes }}

  check-for-patch:
    name: check-for-patch
    runs-on: ubuntu-latest
    outputs:
      patch_file: ${{ steps.get-patch-file.outputs.patch_file }}
    steps:
    - name: Checking For Patch for Older BinaryNinja Versions
      id: get-patch-file
      run: |
        v3_5="v3.5"
        patch_3_5="../../.github/workflows/3.5_0001-Support-building-plugins-without-an-install.patch"
        v4_0="v4.0"
        patch_4_0="../../.github/workflows/4.0_0001-Support-building-plugins-without-an-install.patch"
        v4_1="v4.1"
        patch_4_1="../../.github/workflows/4.1_0001-Support-building-plugins-without-an-install.patch"
        no_patch=""

        if [[ "${{ inputs.version }}" == "$v3_5"* ]]; then
          echo "patch_file=$patch_3_5" >> $GIHUB_OUTPUT
        elif [[ "${{ inputs.version }}" == "$v4_0"* ]]; then
          echo "patch_file=$patch_4_0" >> $GIHUB_OUTPUT
        elif [[ "${{ inputs.version }}" == "$v4_1"* ]]; then
          echo "patch_file=$patch_4_1" >> $GIHUB_OUTPUT
        else
          echo "patch_file=$no_patch" >> $GIHUB_OUTPUT
        fi

  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-13", "macos-latest", "windows-latest"]
    uses: ./.github/workflows/cmake-reusable.yml
    needs: [create-release, check-for-patch]
    with:
      base_artifact_filename: "BinExport-BinaryNinja"
      build_type: "Release"
      os: ${{ matrix.os }}
      patch-file: ${{ needs.check-for-patch.outputs.patch_file }}
      version: ${{ inputs.version}}

  package-release:
    needs: build-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Release Directory
      working-directory: ${{ github.workspace }}
      shell: bash
      run: mkdir -p "${{ github.workspace }}/release"

    - name: Download Artifact / Upload to Release
      # Apparently there isn't a way to associate artifacts with a release.
      working-directory: ${{ github.workspace }}/release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        artifacts_json=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
        while read -r name id; do
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/artifacts/$id/zip \
            > $name.zip
          gh release upload ${{ inputs.release_tag }} \
            ${{ github.workspace }}/release/$name.zip#$name.zip \
            --repo ${{ github.repository }}
        done < <(echo $artifacts_json | jq -r '.artifacts[] | "\(.name) \(.id)"')
