name: binaryninja-release

env:
  BINEXPORT_VERSION: "12"

on:
  workflow_call:
    inputs:
      binaryninja_version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        type: string
      binexport_version:
        description: "BinExport Tag or Commit for Specific Version of the Library from Google"
        type: string
      delete_existing_release:
        description: "Delete the Existing Release and Recreate"
        default: false
        type: boolean
      plugin_version:
        description: "Plugin Tag or Commit for Specific Version Number of this Plugin"
        type: string
      release_tag:
        description: "Tag for the Release (uses plugin version if not provided)"
        type: string
      release_title:
        description: "Release Title (appends plugin version)"
        default: "BinExport Binary Ninja Plugin"
        type: string
      release_notes:
        description: "Release notes as a string"
        default: "This is a build of the BinExport plugin for Binary Ninja from the following versions:"
        type: string

jobs:
  check-for-patch:
    name: check-for-patch
    runs-on: ubuntu-latest
    outputs:
      patch_file: ${{ steps.get-patch-file.outputs.patch_file }}
    steps:
    - name: Checking For Patch for Older BinaryNinja Versions
      id: get-patch-file
      run: |
        v3_5="^v3.5"
        patch_3_5="../../.github/workflows/3.5_0001-Support-building-plugins-without-an-install.patch"
        v4_0="^v4.0"
        patch_4_0="../../.github/workflows/4.0_0001-Support-building-plugins-without-an-install.patch"
        v4_1="^v4.1"
        patch_4_1="../../.github/workflows/4.1_0001-Support-building-plugins-without-an-install.patch"
        patch_file=""

        if [[ ${{ inputs.binaryninja_version }} =~ $v3_5 ]]; then
          patch_file=$patch_3_5
        elif [[ ${{ inputs.binaryninja_version }} =~ $v4_0 ]]; then
          patch_file=$patch_4_0
        elif [[ ${{ inputs.binaryninja_version }} =~ $v4_1 ]]; then
          patch_file=$patch_4_1
        fi

        echo "patch_file=$patch_file" >> $GITHUB_OUTPUT

  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-13", "macos-latest", "windows-latest"]
    uses: ./.github/workflows/cmake-reusable.yml
    needs: check-for-patch
    with:
      base_artifact_filename: "BinExport"
      binaryninja_version: ${{ inputs.binaryninja_version }}
      binexport_version: ${{ inputs.binexport_version }}
      build_type: "Release"
      os: ${{ matrix.os }}
      patch_file: ${{ needs.check-for-patch.outputs.patch_file }}
      plugin_version: ${{ inputs.plugin_version }}

  create-release:
    name: create-release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Release Tag Check
      id: get-release-tag
      run: |
        # Checking if Release Tag is Empty, if it is empty then it is using Plugin Version
        if [ -z ${{ inputs.release_tag }} ]; then
          echo "release_tag=v${{ needs.build-release.outputs.plugin_version }} " >> $GITHUB_OUTPUT
        else
          echo "release_tag=${{ inputs.release_tag }} " >> $GITHUB_OUTPUT
        fi

    - name: Get Release Title
      id: get-release-title
      run: |
        # Appending plugin version number to the Release Title
        echo "release_title=${{ inputs.release_title }} v${{ needs.build-release.outputs.plugin_version }}" >> $GITHUB_OUTPUT

    - name: Check if ${{ inputs.release_tag }} release exists
      id: check-if-release-exists
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view ${{ inputs.release_tag }}; then
          echo "release found"
          echo "release_exists=true" >> $GITHUB_OUTPUT
        else
          echo "release not found"
          echo "release_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Delete ${{ inputs.release_tag }} release
      if: ${{ inputs.delete_existing_release == true }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ ${{ steps.check-if-release-exists.outputs.release_exists == 'true' }} ]]
        echo ${{ steps.check-if-release-exists.outputs.release_exists }}
        echo ${{ inputs.delete_existing_release == true }}
        gh release delete ${{ inputs.release_tag }} --cleanup-tag --yes
        echo "waiting for tag to be deleted"
        while git fetch --tags --prune-tags; git tag -l | grep ${{ inputs.release_tag }}; do
          sleep 5;
        done

    - name: Create Release Notes
      if: ${{ (inputs.delete_existing_release == true) || (steps.check-if-release-exists.outputs.release_exists == 'false') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo ${{ inputs.release_notes }} > notes.txt
        echo "* BinaryNinja API Version: ${{ needs.build-release.outputs.binaryninja_version }}" >> notes.txt
        echo "* BinExport Version: ${{ needs.build-release.outputs.binexport_version }}" >> notes.txt
        cat notes.txt

    - name: Create Release From Tag
      if: ${{ (inputs.delete_existing_release == true) || (steps.check-if-release-exists.outputs.release_exists == 'false') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        gh release create ${{ steps.get-release-tag.outputs.release_tag }}
        --title "${{ inputs.release_title }} ${{ needs.build-release.outputs.plugin_version }}"
        --notes-file notes.txt

    - name: Create Release Directory
      working-directory: ${{ github.workspace }}
      shell: bash
      run: mkdir -p "${{ github.workspace }}/release"

    - name: Download Artifact / Upload to Release
      # Apparently there isn't a way to associate artifacts with a release.
      working-directory: ${{ github.workspace }}/release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        artifacts_json=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
        while read -r name id; do
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/artifacts/$id/zip \
            > $name.zip
          gh release upload ${{ steps.get-release-tag.outputs.release_tag }} \
            ${{ github.workspace }}/release/$name.zip#$name.zip \
            --repo ${{ github.repository }} \
            --clobber
        done < <(echo $artifacts_json | jq -r '.artifacts[] | "\(.name) \(.id)"')
