name: binaryninja-stable
run-name: binaryninja-stable ${{ inputs.binaryninja_version }}

on:
  workflow_dispatch:
    inputs:
      binaryninja_version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        type: string
      binexport_version:
        description: "BinExport Tag or Commit for Specific Version of the Library from Google"
        type: string
      plugin_version:
        description: "Version Number for this Plugin"
        type: string
  schedule:
    - cron: '0 1 * * *' # Daily

jobs:
  check-for-release:
    if: inputs.binaryninja_version == ''
    runs-on: ubuntu-latest
    outputs:
      build_within_24_hours: ${{ steps.is-build-within-24-hours.outputs.build_within_24_hours }}
      latest_binaryninja_commit_date: ${{ steps.get-latest-binaryninja-tag-info.outputs.latest_plugin_commit_date}}
      latest_binaryninja_tag_hash: ${{ steps.get-latest-binaryninja-tag-hash.outputs.latest_binaryninja_tag_hash }}
      latest_binaryninja_tag_name: ${{ steps.get-latest-binaryninja-tag-info.outputs.latest_plugin_tag_name }}

    steps:
    - name: Get Latest Tag Hash from Binary Ninja API
      id: get-latest-binaryninja-tag-hash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag_hash=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/Vector35/binaryninja-api/git/refs/tags \
          | jq -r .[-1].object.sha)
        echo "latest_binaryninja_tag_hash=$tag_hash"
        echo "latest_binaryninja_tag_hash=$tag_hash" >> $GITHUB_OUTPUT

    - name: Get Tag Info from Binary Ninja API
      id: get-latest-binaryninja-tag-info
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        latest_tag=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/Vector35/binaryninja-api/git/commits/${{ steps.get-latest-binaryninja-tag-hash.outputs.latest_binaryninja_tag_hash }})
        commit_date=$(echo $latest_tag | jq -r .committer.date)
        echo "latest_tag_commit_date=$commit_date"
        echo "latest_tag_commit_date=$commit_date" >> $GITHUB_OUTPUT
        tag_name=$(echo $latest_tag | jq -r .tag)
        echo "latest_tag_name=$tag_name"
        echo "latest_tag_name=$tag_name" >> $GITHUB_OUTPUT

    - name: Is Build Within 24 Hours?
      id: is-build-within-24-hours
      run: |
        date_timestamp=$(date -d ${{ steps.get-latest-binaryninja-tag-info.outputs.latest_plugin_commit_date }} +"%s")
        current_timestamp=$(date +"%s")
        twenty_four_hours_ago=$((current_timestamp - 24 * 60 * 60))

        if [[ $date_timestamp -gt $twenty_four_hours_ago ]]; then
          echo "build_within_24_hours=true"
          echo "build_within_24_hours=true" >> $GITHUB_OUTPUT
        else
          echo "build_within_24_hours=false"
          echo "build_within_24_hours=false" >> $GITHUB_OUTPUT
        fi

  binaryninja-stable-release-last-24:
    uses: ./.github/workflows/binaryninja-release.yml
    needs: check-for-release
    if: needs.check-for-release.outputs.build_within_24_hours == 'true'
    with:
      binaryninja_version: ${{ needs.check-for-release.outputs.latest_binaryninja_tag_name }}
      binexport_version: ${{ inputs.binexport_version }}
      plugin_version: ${{ inputs.plugin_version }}
      release_tag: ${{ needs.check-for-release.outputs.latest_binaryninja_tag_name }}
      release_title: "BinExport Binary Ninja Plugin"
      release_notes: >
        "This is a build of the BinExport plugin for Binary Ninja from the following versions:"

  binaryninja-stable-release:
    uses: ./.github/workflows/binaryninja-release.yml
    if: inputs.binaryninja_version != ''
    with:
      binaryninja_version: ${{ inputs.binaryninja_version }}
      binexport_version: ${{ inputs.binexport_version }}
      plugin_version: ${{ inputs.plugin_version }}
      release_title: "BinExport Binary Ninja Plugin"
      release_notes: >
        "This is a build of the BinExport plugin for Binary Ninja from the following versions:"