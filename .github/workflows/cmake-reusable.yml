name: cmake-reusable

env:
  BUILD_DIR: build

on:
  workflow_dispatch:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        required: false
        default: "BinExport-BinaryNinja"
        type: string
      binaryninja-version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        required: true
        default: "dev"
        type: string
      build_type:
        description: "Debug or Release builds"
        required: false
        default: "Release"
        type: string
      os:
        description: "Operating System to Build On"
        required: true
        type: string
      patch-file:
        description: "Workflow Patch File for Older Versions of Binary Ninja"
        required: False
        default: ""
        type: string

  workflow_call:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        required: false
        default: "BinExport"
        type: string
      binaryninja-version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        required: true
        default: "dev"
        type: string
      build_type:
        description: "Debug or Release builds"
        required: false
        default: "Release"
        type: string
      os:
        description: "Operating System to Build On"
        required: true
        type: string
      patch-file:
        description: "Workflow Patch File for Older Versions of Binary Ninja"
        required: False
        default: ""
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4

    - name: Update submodules
      shell: bash
      working-directory: ${{ github.workspace }}
      run: git submodule update --init --recursive

    - name: Update Binexport Library Version File
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Putting in format of major version - date (12-20250619)
        cat ./third-party/binexport/src/CMakeLists.txt | grep "project(binexport VERSION" | \
          awk -F " " '{print $3}' | awk -F ")" '{print $1}' | tr -d '\n' > VERSION_BINEXPORT_LIB.txt
        git log -1 --pretty=format:%ad --date=format:"-%Y%m%d" >> VERSION_BINEXPORT_LIB.txt
        cat VERSION_BINEXPORT_LIB.txt | awk '{print "BinExport Lib Version: "$1}'

    - name: Get Specific Binary Ninja API Version
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binaryninja-api
      run: |
        git fetch --tags
        git checkout --force ${{ inputs.binaryninja-version }}
        git submodule update --init --recursive

        # Attempt to get the tag name
        TAG=$(git describe --exact-match --tags 2>/dev/null)

        # Check if a tag was found
        if [ -n "$TAG" ]; then
          echo "$TAG" > VERSION_BINARYNINJA_LIB.txt
          cat VERSION_BINARYNINJA_LIB.txt | awk '{print "BinaryNinja API Lib Version: "$1}'
        else
          # If no tag, get the current branch name
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "$BRANCH" > ${{ github.workspace }}/VERSION_BINARYNINJA_LIB.txt
          cat VERSION_BINARYNINJA_LIB.txt | awk '{print "BinaryNinja API Lib Version: "$1}'
        fi

    - name: Patch api to allow building headlessly
      if: inputs.patch-file
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binaryninja-api
      run: |
        git apply --verbose ${{ inputs.patch-file }}

    - name: Enable Developer Command Prompt (Windows)
      if: inputs.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Enable mold linker (Linux)
      if: inputs.os == 'ubuntu-latest'
      uses: rui314/setup-mold@v1

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@v4.0.2
      with:
        cmakeVersion: 4.0.2
        ninjaVersion: 1.12.1

    - name: Configure CMake
      id: configure-cmake
      shell: bash
      run: |
        cmake -S "${{ github.workspace }}" -G Ninja -B build \
          "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}"

    - name: Build
      shell: bash
      run: cmake --build ${{ env.BUILD_DIR }}

    - name: Upload Build Artifacts
      id: upload-build-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.base_artifact_filename }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.binaryninja-version }}
        path: |
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dll
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dylib
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.so