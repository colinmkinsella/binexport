name: cmake-reusable
run-name: cmake-reusable

env:
  BUILD_DIR: build

on: 
  workflow_dispatch:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        required: false
        default: "Binexport"
        type: string
      build_type:
        description: "Debug or Release builds"
        required: false
        default: "Release"
        type: string

  workflow_call:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        required: false
        default: "Binexport"
        type: string
      build_type:
        description: "Debug or Release builds"
        required: false
        default: "Release"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: [ubuntu-latest, macos-13, macos-latest, windows-latest]
        - binaryninja-api-ver: ["dev", "v5.0.7486-stable", "v5.0.7290-stable", "v4.2.6455-stable", "v4.1.5902-stable", "v4.1.5747-stable", "v4.0.5336-stable", "v4.0.4958-stable", "v4.0.4911-stable", "v3.5.4526-stable"]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Switch to Binary Ninja API Version 
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binaryninja-api
      run: |
        git switch ${{ matrix.binaryninja-api-ver }}

    - name: Enable Developer Command Prompt (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Enable mold linker (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: rui314/setup-mold@v1

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@v4.0.2
      with:
        cmakeVersion: 4.0.2
        ninjaVersion: 1.12.1

    - name: Configure CMake
      shell: bash
      run: |
        cmake -S "${{ github.workspace }}" -G Ninja -B build \
          "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}"

    - name: Build
      shell: bash
      run: cmake --build ${{ env.BUILD_DIR }}

    - name: Upload Build Artifacts
      id: upload-build-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.base_artifact_filename }}-${{ runner.os }}-${{ runner.arch }}
        path: |
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dll
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dylib
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.so