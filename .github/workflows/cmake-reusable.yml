name: cmake-reusable

env:
  BUILD_DIR: build

on:
  workflow_dispatch:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        default: "BinExport"
        type: string
      binaryninja_version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        default: "dev"
        type: string
      binexport_version:
        description: "BinExport Tag or Commit for Specific Version of the Library from Google"
        default: "main"
        type: string
      build_type:
        description: "Debug or Release builds"
        default: "Release"
        type: string
      os:
        description: "Operating System to Build On"
        required: true
        type: string
      patch_file:
        description: "Workflow Patch File for Older Versions of Binary Ninja"
        type: string
      plugin_version:
        description: "Version Number for this Plugin"
        type: string

  workflow_call:
    inputs:
      base_artifact_filename:
        description: >
          "The base filename of the artifact .zip that is created OS and
          architecture are appended"
        required: False
        default: "BinExport"
        type: string
      binaryninja_version:
        description: "Binary Ninja API Tag or Commit for Specific Version of the API"
        required: False
        default: "dev"
        type: string
      binexport_version:
        description: "BinExport Tag or Commit for Specific Version of the Library from Google"
        required: False
        default: "main"
        type: string
      build_type:
        description: "Debug or Release builds"
        required: false
        default: "Release"
        type: string
      os:
        description: "Operating System to Build On"
        required: true
        type: string
      patch_file:
        description: "Workflow Patch File for Older Versions of Binary Ninja"
        required: False
        default: ""
        type: string
      plugin_version:
        description: "Version Number for this Plugin"
        required: false
        type: string
    outputs:
      binaryninja_version:
        description: "The Version of BinaryNinja that was determined from the tag or commit."
        value: ${{ jobs.build.outputs.binaryninja_version }}
      binexport_version:
        description: "The Version of BinExport that was determined from the tag or commit."
        value: ${{ jobs.build.outputs.binexport_version }}
      plugin_version:
        description: "The Version of This Plugin that was determined from the tag or commit."
        value: ${{ jobs.build.outputs.plugin_version }}

jobs:
  build:
    name: Build ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    outputs:
      binaryninja_version: ${{ steps.get-binaryninja-version.outputs.binaryninja_version }}
      binexport_version: ${{ steps.get-binexport-version.outputs.binexport_version }}
      plugin_version: ${{ steps.get-plugin-version.outputs.plugin_version }}

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4

    - name: Switch to Specific Plugin Version
      if: inputs.plugin_version
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git fetch --tags
        git checkout --force ${{ inputs.plugin_version }}
        git submodule update --init --recursive

    - name: Update submodules
      shell: bash
      working-directory: ${{ github.workspace }}
      run: git submodule update --init --recursive

    - name: Get the Version Number of this Plugin
      id: get-plugin-version
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        cat VERSION_PLUGIN.txt | awk '{print "BinExport Plugin Version: "$1}'
        cat VERSION_PLUGIN.txt | awk '{print "plugin_version="$1}' >> $GITHUB_OUTPUT

    - name: Get Specific BinExport Library Version
      id: get-binexport-version
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binexport/src
      run: |
        if [[ -n "${{ inputs.binexport_version }}" ]]; then
          git fetch --tags
          git checkout --force ${{ inputs.binexport_version }}
          git submodule update --init --recursive

          # Attempt to get the tag name
          set +e
          TAG=$(git describe --exact-match --tags 2>/dev/null)
          echo "TAG=$TAG"
          set -e

          # Check if a tag was found
          if [[ -n "$TAG" ]]; then
            echo "$TAG" | tr -d '\n' > ../../VERSION_BINEXPORT_LIB.txt
          else
            # If no tag, get the current branch name
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "$BRANCH" | tr -d '\n' > ../../VERSION_BINEXPORT_LIB.txt
          fi
        fi

        # Putting in format of major version - date (12-20250619)
        cat CMakeLists.txt | grep "project(binexport VERSION" | \
          awk -F " " '{print $3}' | awk -F ")" '{print $1}' | tr -d '\n' > ../../../VERSION_BINEXPORT_LIB.txt
        git log -1 --pretty=format:%ad --date=format:"-%Y%m%d" >> ../../../VERSION_BINEXPORT_LIB.txt
        cat ../../../VERSION_BINEXPORT_LIB.txt | awk '{print "BinExport Lib Version: "$1}'
        cat ../../../VERSION_BINEXPORT_LIB.txt | awk '{print "binexport_version="$1}' >> $GITHUB_OUTPUT

    - name: Get Specific Binary Ninja API Version
      id: get-binaryninja-version
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binaryninja-api
      run: |
        if [[ -n "${{ inputs.binaryninja_version }}" ]]; then
          git fetch --tags
          git checkout --force ${{ inputs.binaryninja_version }}
          git submodule update --init --recursive

          # Attempt to get the tag name
          set +e
          TAG=$(git describe --exact-match --tags 2>/dev/null)
          set -e

          # Check if a tag was found
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" != "${{ inputs.binaryninja_version }}" ]]; then
              binaryninja_version="${{ inputs.binaryninja_version }}"
            else
              binaryninja_version="$TAG"
            fi
          else
            # If no tag, get the current branch name
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            binaryninja_version="$BRANCH"
          fi

          # replacing forward slashes with dashes
          binaryninja_version="${binaryninja_version//\//-}"
          echo "$binaryninja_version" | tr -d '\n' > ../../VERSION_BINARYNINJA_LIB.txt
        fi

        # displaying as forward slashes to better represent the version, but need dashes for the filename
        cat ../../VERSION_BINARYNINJA_LIB.txt | sed 's/-/\//g' | awk '{print "BinaryNinja API Lib Version: "$1}'
        cat ../../VERSION_BINARYNINJA_LIB.txt | awk '{print "binaryninja_version="$1}' >> $GITHUB_OUTPUT

    - name: Patch api to allow building headlessly
      if: inputs.patch_file
      shell: bash
      working-directory: ${{ github.workspace }}/third-party/binaryninja-api
      run: |
        git apply --verbose ${{ inputs.patch_file }}

    - name: Get Cache Key
      id: get-cache-key
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        absl_timestamp=$(gh api repos/abseil/abseil-cpp/commits/master --jq .commit.author.date)
        protobuf_timestamp=$(gh api repos/protocolbuffers/protobuf/commits/main --jq .commit.author.date)
        cache_key="${{ github.repository }}_"
        cache_key+="${{ runner.os }}-${{ runner.arch }}_"
        cache_key+="${{ steps.get-binaryninja-version.outputs.binaryninja_version }}_"
        cache_key+="${{ steps.get-binexport-version.outputs.binexport_version }}_"
        cache_key+="$absl_timestamp"
        cache_key+="_"
        cache_key+="$protobuf_timestamp"
        echo "cache_key=$cache_key"
        echo "cache_key=$cache_key" >> $GITHUB_OUTPUT

    - name: Enable Developer Command Prompt (Windows)
      if: inputs.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Enable mold linker (Linux)
      if: inputs.os == 'ubuntu-latest'
      uses: rui314/setup-mold@v1

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@v4.0.2
      with:
        cmakeVersion: 4.0.2
        ninjaVersion: 1.12.1

    - name: Cache Restore CMake Build
      id: cache-restore-build
      uses: actions/cache/restore@v4
      with:
        path: build
        key: ${{ steps.get-cache-key.outputs.cache_key }}

    - name: Configure CMake
      id: configure-cmake
      shell: bash
      run: |
        cmake -S "${{ github.workspace }}" -G Ninja -B build \
          "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}"

    - name: Build
      shell: bash
      run: cmake --build ${{ env.BUILD_DIR }}

    - name: Cache Save CMake Build
      id: cache-save-build
      if: steps.cache-restore-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build
        key: ${{ steps.get-cache-key.outputs.cache_key }}

    - name: Get Artifact Name
      id: get-artifact-name
      shell: bash
      run: |
        artifact_name="${{ inputs.base_artifact_filename }}"
        artifact_name+="${{ steps.get-binexport-version.outputs.binexport_version }}"
        artifact_name+="_BinaryNinja-${{ steps.get-binaryninja-version.outputs.binaryninja_version }}"
        artifact_name+="_Plugin-${{ steps.get-plugin-version.outputs.plugin_version }}"
        artifact_name+="_${{ runner.os }}-${{ runner.arch }}"
        echo "artifact_name=$artifact_name"
        echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

    - name: Upload Build Artifacts
      id: upload-build-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.get-artifact-name.outputs.artifact_name }}
        path: |
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dll
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.dylib
          ${{ github.workspace }}/${{ env.BUILD_DIR }}/*.so