# Apparently you cannot specify default input for push and pull_requests.
# Created this job as a wrapper for calling the reusable cmake workflow.
name: cmake-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cmake-reusable:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-13", "macos-latest", "windows-latest"]
        version: # BinaryNinja API Versions
        - name: "dev"
        - name: "v5.0.7486-stable"
        - name: "v5.0.7290-stable"
        - name: "v4.2.6455-stable"
        - name: "v4.1.5902-stable"
          patch_file: "../../.github/workflows/4.1_0001-Support-building-plugins-without-an-install.patch"
        - name: "v4.1.5747-stable"
          patch_file: "../../.github/workflows/4.1_0001-Support-building-plugins-without-an-install.patch"
        - name: "v4.0.5336-stable"
          patch_file: "../../.github/workflows/4.0_0001-Support-building-plugins-without-an-install.patch"
        - name: "v4.0.4958-stable"
          patch_file: "../../.github/workflows/4.0_0001-Support-building-plugins-without-an-install.patch"
        - name: "v4.0.4911-stable"
          patch_file: "../../.github/workflows/4.0_0001-Support-building-plugins-without-an-install.patch"
        - name: "v3.5.4526-stable"
          patch_file: "../../.github/workflows/3.5_0001-Support-building-plugins-without-an-install.patch"
    uses: ./.github/workflows/cmake-reusable.yml
    with:
      binaryninja_version: ${{ matrix.version.name }}
      os: ${{ matrix.os }}
      patch_file: ${{ matrix.version.patch_file }}
